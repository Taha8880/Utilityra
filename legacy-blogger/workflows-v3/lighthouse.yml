name: Lighthouse audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Lighthouse CI against the public site
        run: npx --yes @lhci/cli@0.14.x autorun --collect.url=https://utilityra.blogspot.com/ --collect.numberOfRuns=1 --assert.preset=lighthouse:recommended