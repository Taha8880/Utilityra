name: Utilityra live health monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/utilityra-live-monitor.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: utilityra-live-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check homepage, sitemap and every published route
        shell: bash
        run: |
          set -uo pipefail
          BASE="https://utilityra.tavengers16.workers.dev"
          failures=0
          check_path() {
            local path="$1"
            local code result
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 12 "$BASE$path")
            result=$?
            if [ "$result" -ne 0 ] || ! [[ "$code" =~ ^[0-9]{3}$ ]] || [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "FAIL $path HTTP=$code curl_exit=$result"
              failures=$((failures + 1))
            else
              echo "PASS $path HTTP=$code"
            fi
          }
          for path in / /robots.txt /sitemap.xml /tools/word-counter /tools/pdf-to-text /admin; do
            check_path "$path"
          done
          sitemap=$(curl -fsS --max-time 20 "$BASE/sitemap.xml")
          if [ $? -ne 0 ] || [ -z "$sitemap" ]; then
            echo "FAIL sitemap could not be downloaded or was empty"
            failures=$((failures + 1))
          else
            mapfile -t routes < <(printf '%s' "$sitemap" | grep -oE '<loc>[^<]+' | sed 's#<loc>##' | sed "s#^$BASE##" | grep '^/' | sort -u)
            if [ "${#routes[@]}" -eq 0 ]; then
              echo "FAIL sitemap contained no usable local routes"
              failures=$((failures + 1))
            else
              echo "Discovered ${#routes[@]} routes from sitemap; checking each published URL."
              for path in "${routes[@]}"; do check_path "$path"; done
            fi
          fi
          echo "Total route failures: $failures"
          if [ "$failures" -gt 0 ]; then exit 1; fi
      - name: Open an incident issue if health checks fail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          title='[Utilityra Monitor] فشل فحص حي للموقع'
          existing=$(gh issue list --state open --search "$title in:title" --json title --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "An open monitoring incident already exists; avoiding duplicate issue."
            exit 0
          fi
          body=$(printf 'فشل فحص دوري للموقع العام.\n\nراجع سجل GitHub Actions: %s/%s/actions/runs/%s\n\nالمسارات المفحوصة: /, /robots.txt, /sitemap.xml, /tools/word-counter, /tools/pdf-to-text\n\nهذا تنبيه وليس تأكيدًا أن الإصلاح تم. افحص سجلات Cloudflare والـ workflow قبل إغلاق البلاغ.' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh issue create --title "$title" --body "$body"
