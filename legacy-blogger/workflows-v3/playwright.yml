name: Cloudflare Utilityra browser tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'tests/e2e/cloudflare-tools.spec.js'
      - 'tests/e2e/tool-accuracy.spec.js'
      - 'tests/worker.test.mjs'
      - 'scripts/validate-cloudflare.mjs'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main]
jobs:
  cloudflare-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Cloudflare app and tool registry
        run: node scripts/validate-cloudflare.mjs
      - name: Validate Worker JavaScript syntax
        run: node --check worker/src/index.js
      - name: Test Worker API and route behavior
        run: node --test tests/worker.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test published Cloudflare tools on desktop and mobile
        run: npx playwright test tests/e2e/cloudflare-tools.spec.js tests/e2e/tool-accuracy.spec.js --project=chromium-desktop --project=chromium-mobile
        env:
          CI: true
