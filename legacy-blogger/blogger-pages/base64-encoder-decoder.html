<!-- Utilityra tool page: Base64 text encoder/decoder. Review as a Blogger draft before publishing. -->
<section class="ur-tool" lang="en" aria-labelledby="ube-title">
  <p class="ur-eyebrow">DEVELOPER TOOLS</p><h2 id="ube-title">Base64 Encoder and Decoder</h2>
  <p>Convert plain text to Base64 or decode Base64 text. Base64 is encoding, not encryption; do not use it to protect secrets.</p>
  <label for="ube-input">Input text</label><textarea id="ube-input" rows="8" placeholder="Enter text…"></textarea>
  <div class="ur-actions"><button type="button" id="ube-encode" class="ur-primary">Encode</button><button type="button" id="ube-decode" class="ur-secondary">Decode</button><button type="button" id="ube-clear" class="ur-secondary">Clear</button></div>
  <p id="ube-status" role="status" aria-live="polite"></p><label for="ube-output">Result</label><textarea id="ube-output" rows="8" readonly="readonly"></textarea><button type="button" id="ube-copy" class="ur-secondary">Copy result</button>
</section>
<script>
(function(){const $=id=>document.getElementById(id),input=$('ube-input'),output=$('ube-output'),status=$('ube-status');if(!input||!output)return;
function toBase64(s){const bytes=new TextEncoder().encode(s);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary)}
function fromBase64(s){const binary=atob(s.replace(/\s/g,'')),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}
$('ube-encode').addEventListener('click',()=>{output.value=toBase64(input.value);status.textContent='Encoding completed.'});
$('ube-decode').addEventListener('click',()=>{try{output.value=fromBase64(input.value);status.textContent='Decoding completed.'}catch{output.value='';status.textContent='Invalid Base64 or unsupported text encoding.'}});
$('ube-clear').addEventListener('click',()=>{input.value='';output.value='';status.textContent=''});
$('ube-copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(output.value);status.textContent='Copied.'}catch{output.focus();output.select();status.textContent='Select the result and copy it manually.'}});
})();
</script>
