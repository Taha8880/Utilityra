<meta name="description" content="Generate random integers using Web Crypto when available."><section class="ur-tool" data-tool-id="random-number-generator" lang="ar" aria-labelledby="random-number-generator-title"><p class="ur-eyebrow">CALCULATORS · UTILITYRA</p><h2 id="random-number-generator-title">Random Number Generator — مولد أرقام عشوائية</h2><p>أنشئ أرقامًا عشوائية.</p><label for="random-number-generator-input">أدخل البيانات</label><textarea id="random-number-generator-input" rows="8" spellcheck="false" placeholder="1, 100, 10"></textarea><p class="ur-note">تُعالج البيانات داخل المتصفح. راجع النتيجة قبل نشر ملفات أو إعدادات مهمة.</p><div class="ur-actions"><button class="ur-primary" type="button" id="random-number-generator-run">تنفيذ</button><button class="ur-secondary" type="button" id="random-number-generator-copy">نسخ النتيجة</button><button class="ur-secondary" type="button" id="random-number-generator-clear">مسح</button></div><label for="random-number-generator-output">النتيجة</label><textarea id="random-number-generator-output" rows="9" readonly></textarea><p id="random-number-generator-status" role="status" aria-live="polite"></p></section><script>(function(){const id="random-number-generator",input=document.getElementById(id+'-input'),output=document.getElementById(id+'-output'),status=document.getElementById(id+'-status');function runTool(id,raw){
const s=raw.trim(),lines=raw.split(/\r?\n/),xe=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const csv=text=>{const rows=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"'&&!v)q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=c}if(q)throw Error('CSV has an unclosed quote.');if(v!==''||row.length){row.push(v.replace(/\r$/,''));rows.push(row)}return rows};
switch(id){
case 'meta-tag-generator':{const p=lines;return '<title>'+xe(p[0]||'Page title')+'</title>\n<meta name="description" content="'+xe(p[1]||'')+'">\n<link rel="canonical" href="'+xe(p[2]||'')+'">\n<meta property="og:title" content="'+xe(p[0]||'Page title')+'">\n<meta property="og:description" content="'+xe(p[1]||'')+'">\n<meta property="og:url" content="'+xe(p[2]||'')+'">'}
case 'robots-txt-generator':{const u=s||'https://example.com/sitemap.xml';if(!/^https:\/\/[^ ]+\/sitemap\.xml$/i.test(u))throw Error('Enter a full HTTPS sitemap.xml URL.');return 'User-agent: *\nAllow: /\nDisallow: /search\n\nSitemap: '+u+'\n\nReview rules for your platform before deployment.'}
case 'sitemap-generator':{const urls=lines.map(x=>x.trim()).filter(Boolean);if(!urls.length||urls.some(x=>{try{return new URL(x).protocol!=='https:'}catch{return true}}))throw Error('Enter one valid HTTPS URL per line.');return '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+urls.map(x=>'  <url><loc>'+xe(x)+'</loc></url>').join('\n')+'\n</urlset>'}
case 'url-parser':{let u;try{u=new URL(s)}catch{throw Error('Enter a full URL including https://.')}return 'Protocol: '+u.protocol+'\nHost: '+u.host+'\nPath: '+u.pathname+'\nQuery: '+u.search+'\nFragment: '+u.hash+'\nParameters:\n'+[...u.searchParams].map(([k,v])=>k+' = '+v).join('\n')}
case 'cron-validator':{const p=s.split(/\s+/);if(p.length!==5)throw Error('Cron needs five fields: minute hour day month weekday.');const r=[[0,59],[0,23],[1,31],[1,12],[0,7]];p.forEach((v,i)=>{if(!/^[0-9*/?,\-]+$/.test(v)||((v.match(/\d+/g)||[]).some(n=>Number(n)<r[i][0]||Number(n)>r[i][1])))throw Error('Invalid field '+(i+1)+'; expected range '+r[i].join('–'))});return 'Five-field cron shape looks valid.\nMinute: '+p[0]+'\nHour: '+p[1]+'\nDay: '+p[2]+'\nMonth: '+p[3]+'\nWeekday: '+p[4]+'\nCheck your scheduler dialect.'}
case 'csv-to-markdown':case 'csv-validator':{const rows=csv(s),n=rows[0]?.length||0;if(id==='csv-validator'){const bad=rows.map((r,i)=>r.length===n?'':'Row '+(i+1)+': '+r.length+' columns; expected '+n).filter(Boolean);return 'Rows: '+rows.length+'\nColumns: '+n+'\n'+(bad.join('\n')||'All rows have matching column counts.')}return '| '+rows[0].join(' | ')+' |\n| '+rows[0].map(()=> '---').join(' | ')+' |\n'+rows.slice(1).map(r=>'| '+Array.from({length:n},(_,i)=>(r[i]||'').replace(/\|/g,'\\|')).join(' | ')+' |').join('\n')}
case 'markdown-table-generator':{const rows=lines.filter(Boolean).map(x=>x.split('|').map(v=>v.trim()));if(!rows.length)throw Error('Enter one pipe-separated row per line.');const n=Math.max(...rows.map(r=>r.length)),rs=rows.map(r=>Array.from({length:n},(_,i)=>(r[i]||'').replace(/\|/g,'\\|')));return '| '+rs[0].join(' | ')+' |\n| '+rs[0].map(()=> '---').join(' | ')+' |\n'+rs.slice(1).map(r=>'| '+r.join(' | ')+' |').join('\n')}
case 'file-size-converter':{const n=Number(s);if(!s||!Number.isFinite(n)||n<0)throw Error('Enter a non-negative byte count.');return 'Bytes: '+n+'\nKB: '+n/1e3+'\nMB: '+n/1e6+'\nGB: '+n/1e9+'\nKiB: '+n/1024+'\nMiB: '+n/1048576+'\nGiB: '+n/1073741824}
case 'random-number-generator':{const p=s.split(/[,\s;]+/).map(Number),a=p[0],b=p[1],n=Math.max(1,Math.min(500,Math.trunc(p[2]||1)));if(p.length<2||!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||a>b||b-a>1e9)throw Error('Enter minimum, maximum, optional count (up to 500).');const out=[];for(let i=0;i<n;i++){const range=b-a+1;if(crypto.getRandomValues){const lim=Math.floor(4294967296/range)*range;let x;do{x=crypto.getRandomValues(new Uint32Array(1))[0]}while(x>=lim);out.push(a+x%range)}else out.push(Math.floor(Math.random()*range)+a)}return out.join('\n')}
case 'password-strength-checker':{const p=raw,checks=[p.length>=12,/[a-z]/.test(p),/[A-Z]/.test(p),/\d/.test(p),/[^\w]/.test(p),p.length>=16],n=checks.filter(Boolean).length;return (n>=5?'Stronger by basic checks':n>=3?'Moderate — use a longer unique passphrase':'Weak — use a longer unique passphrase')+'\nLength: '+p.length+'\nLowercase: '+checks[1]+'\nUppercase: '+checks[2]+'\nDigits: '+checks[3]+'\nSymbols: '+checks[4]+'\nLocal heuristic only; no breach check or upload.'}
case 'excel-formula-helper':{const p=lines.map(x=>x.trim()),op=(p[0]||'sum').toLowerCase(),range=p[1]||'A1:A10',crit=p[2]||'Yes';if(!/^[A-Z]{1,3}\d+:[A-Z]{1,3}\d+$/i.test(range))throw Error('Line 2: range like A1:A10. Line 1: sum, average, count, max, min or countif.');const f={sum:'=SUM('+range+')',average:'=AVERAGE('+range+')',count:'=COUNT('+range+')',max:'=MAX('+range+')',min:'=MIN('+range+')',countif:'=COUNTIF('+range+', "'+crit.replace(/"/g,'""')+'")'};if(!f[op])throw Error('Unsupported formula type.');return f[op]+'\nCheck spreadsheet locale and function support.'}
case 'timezone-converter':{const p=raw.split('|').map(x=>x.trim());if(p.length<2)throw Error('Enter ISO date/time | IANA timezone, e.g. 2026-10-22T12:00:00Z | Africa/Cairo');const d=new Date(p[0]);if(Number.isNaN(d.getTime()))throw Error('Enter a valid ISO date/time, preferably with Z or UTC offset.');return new Intl.DateTimeFormat('en-GB',{dateStyle:'full',timeStyle:'long',timeZone:p[1]}).format(d)+'\nZone: '+p[1]+'\nUTC instant: '+d.toISOString()}
case 'citation-formatter':{const p=lines.map(x=>x.trim());if(!p[0]||!p[1])throw Error('Line 1 author; line 2 year; optional lines: title, publisher/site, URL.');return p[0]+'. ('+p[1]+'). '+(p[2]||'[Title]')+'. '+(p[3]||'[Publisher]')+'.'+(p[4]?' '+p[4]:'')+'\n\nAPA-style draft; verify required style and source details.'}
default:throw Error('Tool not configured.');
}}document.getElementById(id+'-run').addEventListener('click',async()=>{status.textContent='جارٍ التنفيذ…';try{const v=await runTool(id,input.value);output.value=typeof v==='string'?v:String(v);status.textContent='تم التنفيذ. راجع النتيجة.'}catch(e){output.value='';status.textContent=e&&e.message?e.message:'حدث خطأ غير متوقع.'}});document.getElementById(id+'-copy').addEventListener('click',async()=>{if(!output.value){status.textContent='لا توجد نتيجة.';return}try{await navigator.clipboard.writeText(output.value);status.textContent='تم النسخ.'}catch(e){output.focus();output.select();status.textContent='حدد النص وانسخه يدويًا.'}});document.getElementById(id+'-clear').addEventListener('click',()=>{input.value='';output.value='';status.textContent=''})})();</script>
