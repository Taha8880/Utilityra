<!-- Utilityra tool page: password generator. Review as a Blogger draft before publishing. -->
<section class="ur-tool" lang="en" aria-labelledby="upg-title">
  <p class="ur-eyebrow">PRIVACY TOOLS</p><h2 id="upg-title">Secure Password Generator</h2>
  <p>Generate passwords locally with the Web Crypto API. Passwords are not sent to a server or stored by this page.</p>
  <div class="ur-form-grid"><label for="upg-length">Length (12–128)<input id="upg-length" type="number" min="12" max="128" value="20"/></label><label for="upg-count">Number (1–20)<input id="upg-count" type="number" min="1" max="20" value="5"/></label></div>
  <div class="ur-actions"><label><input type="checkbox" id="upg-upper" checked="checked"/> Uppercase</label><label><input type="checkbox" id="upg-lower" checked="checked"/> Lowercase</label><label><input type="checkbox" id="upg-number" checked="checked"/> Numbers</label><label><input type="checkbox" id="upg-symbol" checked="checked"/> Symbols</label></div>
  <div class="ur-actions"><button type="button" id="upg-run" class="ur-primary">Generate passwords</button><button type="button" id="upg-copy" class="ur-secondary">Copy all</button><button type="button" id="upg-clear" class="ur-secondary">Clear</button></div>
  <p id="upg-status" role="status" aria-live="polite"></p><label for="upg-output">Passwords</label><textarea id="upg-output" rows="10" readonly="readonly" autocomplete="off"></textarea>
  <p class="ur-note">Use a password manager and never reuse passwords. This tool cannot guarantee that a password meets every service's policy.</p>
</section>
<script>
(function(){const $=id=>document.getElementById(id),out=$('upg-output'),status=$('upg-status');if(!out)return;
function pick(chars){const a=new Uint32Array(1);const max=Math.floor(4294967296/chars.length)*chars.length;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=max);return chars[x%chars.length]}
$('upg-run').addEventListener('click',()=>{const len=Number($('upg-length').value),count=Number($('upg-count').value),sets=[];if($('upg-upper').checked)sets.push('ABCDEFGHJKLMNPQRSTUVWXYZ');if($('upg-lower').checked)sets.push('abcdefghijkmnopqrstuvwxyz');if($('upg-number').checked)sets.push('23456789');if($('upg-symbol').checked)sets.push('!#$%&()*+,-./:;<=>?@[]^_{|}~');if(!Number.isInteger(len)||len<12||len>128||!Number.isInteger(count)||count<1||count>20){status.textContent='Check the length and count limits.';return}if(!sets.length){status.textContent='Choose at least one character group.';return}out.value=Array.from({length:count},()=>{const all=sets.join(''),chars=sets.map(pick);while(chars.length<len)chars.push(pick(all));for(let i=chars.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[chars[i],chars[j]]=[chars[j],chars[i]]}return chars.join('')}).join('\n');status.textContent=count+' passwords generated locally.'});
$('upg-copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(out.value);status.textContent='Copied. Avoid copying passwords on shared devices.'}catch{out.focus();out.select();status.textContent='Select the result and copy it manually.'}});
$('upg-clear').addEventListener('click',()=>{out.value='';status.textContent=''});
})();
</script>
