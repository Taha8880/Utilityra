<section class="ur-tool" data-tool-id="image-to-data-uri" lang="ar"><p class="ur-eyebrow">IMAGE · DEVELOPER</p><h2>Image to Base64 Data URI — تحويل الصورة إلى Data URI</h2><p>حوّل صورة صغيرة إلى نص للاختبار في HTML وCSS، دون رفعها إلى خادم.</p><label for="idu-file">اختر صورة (حتى 4 MB)</label><input id="idu-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp"><div class="ur-actions"><button id="idu-run" class="ur-primary" type="button">تحويل</button><button id="idu-copy" class="ur-secondary" type="button">نسخ النص</button></div><p id="idu-status" role="status"></p><label for="idu-output">Data URI</label><textarea id="idu-output" rows="8" readonly></textarea><p class="ur-note">Data URI كبير قد يبطئ الصفحة؛ استخدمه للصور الصغيرة فقط.</p></section><script>(function(){const $=id=>document.getElementById(id);$('idu-run').addEventListener('click',()=>{const f=$('idu-file').files[0];if(!f){$('idu-status').textContent='اختر صورة أولًا.';return}if(f.size>4*1024*1024){$('idu-status').textContent='الملف أكبر من 4 MB.';return}const r=new FileReader();r.onload=()=>{$('idu-output').value=String(r.result);$('idu-status').textContent='تم التحويل محليًا؛ الحجم '+f.size+' بايت.'};r.onerror=()=>$('idu-status').textContent='تعذر قراءة الملف.';r.readAsDataURL(f)});$('idu-copy').addEventListener('click',async()=>{const o=$('idu-output');if(!o.value){$('idu-status').textContent='حوّل صورة أولًا.';return}try{await navigator.clipboard.writeText(o.value);$('idu-status').textContent='تم النسخ.'}catch(e){o.select();$('idu-status').textContent='حدد النص وانسخه يدويًا.'}})})();</script>
