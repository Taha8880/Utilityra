<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><section class="ur-tool" data-tool-id="pdf-merge" lang="ar"><p class="ur-eyebrow">FILES · PDF</p><h2>PDF Merger — دمج ملفات PDF</h2><p>ادمج عدة ملفات PDF داخل المتصفح. لا يتم رفع الملفات إلى خادم Utilityra.</p><label for="pdfm-files">اختر ملفين أو أكثر (حد أقصى 10 ملفات، 25 MB لكل ملف)</label><input id="pdfm-files" type="file" accept="application/pdf,.pdf" multiple><div class="ur-actions"><button id="pdfm-run" class="ur-primary" type="button">دمج الملفات</button><a id="pdfm-download" class="ur-secondary ur-hidden" download="merged.pdf">تنزيل الملف المدمج</a></div><p id="pdfm-status" role="status" aria-live="polite"></p><p class="ur-note">قد تكون بعض ملفات PDF المشفرة أو التالفة غير مدعومة. احتفظ بنسخ أصلية.</p></section><script>(function(){const $=id=>document.getElementById(id);$('pdfm-run').addEventListener('click',async()=>{const files=Array.from($('pdfm-files').files||[]);if(files.length<2){$('pdfm-status').textContent='اختر ملفين على الأقل.';return}if(files.length>10||files.reduce((n,f)=>n+f.size,0)>50*1024*1024||files.some(f=>f.size>25*1024*1024||f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))){$('pdfm-status').textContent='الحد 10 ملفات، و25 MB لكل ملف، و50 MB إجماليًا.';return}if(!window.PDFLib){$('pdfm-status').textContent='مكتبة PDF لم تُحمّل؛ تحقق من اتصال الإنترنت ثم أعد المحاولة.';return}try{$('pdfm-status').textContent='جارٍ دمج الملفات محليًا…';const out=await PDFLib.PDFDocument.create();for(const f of files){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}const bytes=await out.save(),blob=new Blob([bytes],{type:'application/pdf'}),a=$('pdfm-download');a.href=URL.createObjectURL(blob);a.classList.remove('ur-hidden');$('pdfm-status').textContent='تم دمج '+files.length+' ملفات في '+out.getPageCount()+' صفحات.'}catch(e){$('pdfm-status').textContent='تعذر دمج الملفات؛ قد يكون أحدها تالفًا أو مشفرًا.'}})})();</script>
