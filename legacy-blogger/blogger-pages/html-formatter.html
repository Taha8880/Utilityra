<meta name="description" content="Indent basic HTML markup for easier reading."><section class="ur-tool" data-tool-id="html-formatter" lang="ar" aria-labelledby="html-formatter-title"><p class="ur-eyebrow">DEVELOPER · UTILITYRA</p><h2 id="html-formatter-title">HTML Formatter — منسق HTML</h2><p>نسّق HTML.</p><label for="html-formatter-input">أدخل البيانات</label><textarea id="html-formatter-input" rows="8" spellcheck="false" placeholder="<div><p>Hello</p><span>World</span></div>"></textarea><p class="ur-note">تُعالج البيانات داخل المتصفح. فك الترميز لا يعني التحقق من التوقيع أو صحة المصدر.</p><div class="ur-actions"><button class="ur-primary" type="button" id="html-formatter-run">تنفيذ</button><button class="ur-secondary" type="button" id="html-formatter-copy">نسخ النتيجة</button><button class="ur-secondary" type="button" id="html-formatter-clear">مسح</button></div><label for="html-formatter-output">النتيجة</label><textarea id="html-formatter-output" rows="9" readonly></textarea><p id="html-formatter-status" role="status" aria-live="polite"></p></section><script>(function(){const id="html-formatter",input=document.getElementById(id+'-input'),output=document.getElementById(id+'-output'),status=document.getElementById(id+'-status');function runTool(id,raw){
const s=raw.trim(),lines=raw.split(/\r?\n/),xe=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
switch(id){
case 'number-base-converter':{const n=Number(s);if(!s||!Number.isSafeInteger(n))throw Error('Enter a safe integer in decimal.');return 'Binary: '+n.toString(2)+'\nOctal: '+n.toString(8)+'\nDecimal: '+n+'\nHex: 0x'+n.toString(16).toUpperCase()}
case 'binary-hex-converter':{let n;if(/^0b[01]+$/i.test(s))n=parseInt(s.slice(2),2);else if(/^[01]+$/.test(s))n=parseInt(s,2);else if(/^0x[0-9a-f]+$/i.test(s))n=parseInt(s.slice(2),16);else throw Error('Enter binary (1010) or hex (0xFF).');if(!Number.isSafeInteger(n))throw Error('Value exceeds safe integer range.');return 'Decimal: '+n+'\nBinary: '+n.toString(2)+'\nHex: 0x'+n.toString(16).toUpperCase()}
case 'json-to-xml':{const obj=JSON.parse(s);function node(k,v){if(Array.isArray(v))return v.map(x=>node(k,x)).join('');if(v&&typeof v==='object')return '<'+k+'>'+Object.entries(v).map(([a,b])=>node(a.replace(/[^A-Za-z0-9_.-]/g,'_')||'item',b)).join('')+'</'+k+'>';return '<'+k+'>'+xe(v==null?'':v)+'</'+k+'>'}return '<?xml version="1.0" encoding="UTF-8"?>\n<root>'+node('item',obj)+'</root>'}
case 'xml-formatter':{const d=new DOMParser().parseFromString(s,'application/xml');if(d.querySelector('parsererror'))throw Error('Invalid XML: '+d.querySelector('parsererror').textContent.slice(0,180));return new XMLSerializer().serializeToString(d).replace(/>\s*</g,'>\n<')}
case 'sql-formatter':return s.replace(/\s+/g,' ').replace(/\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|JOIN|LEFT JOIN|INNER JOIN|ON|UNION|VALUES|SET|INSERT INTO|UPDATE|DELETE FROM|AND|OR)\b/gi,'\n$1').replace(/^\n/,'').trim();
case 'regex-tester':{const i=raw.indexOf('\n---\n');if(i<0)throw Error('Pattern on line 1, then --- and sample text.');const p=raw.slice(0,i).trim(),txt=raw.slice(i+5),m=p.match(/^\/(.*)\/([dgimsuvy]*)$/),re=new RegExp(m?m[1]:p,m?(m[2].includes('g')?m[2]:m[2]+'g'):'g'),matches=[...txt.matchAll(re)].slice(0,100);return 'Matches: '+matches.length+'\n'+matches.map((x,j)=>(j+1)+'. '+JSON.stringify(x[0])+' at '+x.index).join('\n')}
case 'jwt-decoder':{const p=s.split('.');if(p.length!==3)throw Error('JWT should contain three parts.');const dec=x=>JSON.stringify(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-x.length%4)%4)),c=>c.charCodeAt(0)))),null,2);return 'HEADER\n'+dec(p[0])+'\n\nPAYLOAD\n'+dec(p[1])+'\n\nSignature is NOT verified. Claims are untrusted.'}
case 'sha256-hash':return crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)).then(b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join(''));
case 'json-diff':{const p=raw.split('\n===COMPARE===\n');if(p.length!==2)throw Error('Separate two JSON documents with ===COMPARE===.');const a=JSON.parse(p[0]),b=JSON.parse(p[1]),o=[];function cmp(x,y,k){if(JSON.stringify(x)===JSON.stringify(y))return;if(x&&y&&typeof x==='object'&&typeof y==='object'&&Array.isArray(x)===Array.isArray(y)){for(const key of new Set([...Object.keys(x),...Object.keys(y)]))cmp(x[key],y[key],k+(Array.isArray(x)?'['+key+']':'.'+key))}else o.push(k+': '+(x===undefined?'[missing]':JSON.stringify(x))+' => '+(y===undefined?'[missing]':JSON.stringify(y)))}cmp(a,b,'$');return o.join('\n')||'No differences found.'}
case 'html-formatter':return s.replace(/>\s*</g,'>\n<').replace(/(<\/?(?:div|section|main|header|footer|ul|ol|li|table|tr|h[1-6]|p|form|article|nav)\b[^>]*>)/gi,'\n$1').split('\n').filter(Boolean).map((x,i)=>'  '.repeat(Math.min(8,Math.max(0,x.trim().startsWith('</')?i-1:i)))+x.trim()).join('\n');
case 'css-formatter':return s.replace(/\s*\{\s*/g,' {\n  ').replace(/\s*;\s*/g,';\n  ').replace(/\s*}\s*/g,'\n}\n').replace(/,\s*/g,', ').replace(/\n{3,}/g,'\n\n').trim();
case 'color-converter':{let h=s.replace(/^#/,'');if(!/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(h))throw Error('Enter HEX such as #6750A4.');if(h.length===3)h=h.split('').map(x=>x+x).join('');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16),R=r/255,G=g/255,B=b/255,ma=Math.max(R,G,B),mi=Math.min(R,G,B),d=ma-mi,l=(ma+mi)/2;let hue=0,ss=0;if(d){ss=d/(1-Math.abs(2*l-1));if(ma===R)hue=60*(((G-B)/d)%6);else if(ma===G)hue=60*((B-R)/d+2);else hue=60*((R-G)/d+4)}return 'HEX #'+h.toUpperCase()+'\nRGB rgb('+r+', '+g+', '+b+')\nHSL hsl('+Math.round((hue+360)%360)+', '+Math.round(ss*100)+'%, '+Math.round(l*100)+'%)'}
case 'gradient-generator':{const cs=s.split(/[,\s]+/).filter(Boolean);if(cs.length<2||cs.some(x=>!/^#?(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(x)))throw Error('Enter at least two HEX colors separated by commas.');return 'background: linear-gradient(135deg, '+cs.map(x=>x.startsWith('#')?x:'#'+x).join(', ')+');'}
case 'box-shadow-generator':{const p=s.split(/[,\s]+/);if(p.length<4||!p.slice(0,4).every(x=>Number.isFinite(Number(x))))throw Error('Enter x, y, blur, spread, color. Example: 0, 8, 24, 0, #00000033');return 'box-shadow: '+p[0]+'px '+p[1]+'px '+Math.max(0,Number(p[2]))+'px '+p[3]+'px '+(p[4]||'#00000033')+';'}
default:throw Error('Tool not configured.');
}}document.getElementById(id+'-run').addEventListener('click',async()=>{status.textContent='جارٍ التنفيذ…';try{const v=await runTool(id,input.value);output.value=typeof v==='string'?v:String(v);status.textContent='تم التنفيذ. راجع النتيجة.'}catch(e){output.value='';status.textContent=e&&e.message?e.message:'حدث خطأ غير متوقع.'}});document.getElementById(id+'-copy').addEventListener('click',async()=>{if(!output.value){status.textContent='لا توجد نتيجة.';return}try{await navigator.clipboard.writeText(output.value);status.textContent='تم النسخ.'}catch(e){output.focus();output.select();status.textContent='حدد النص وانسخه يدويًا.'}});document.getElementById(id+'-clear').addEventListener('click',()=>{input.value='';output.value='';status.textContent=''})})();</script>
