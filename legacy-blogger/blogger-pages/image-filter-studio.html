<section class="ur-tool" data-tool-id="image-filter-studio" lang="ar"><p class="ur-eyebrow">IMAGE · DESIGN</p><h2>Image Filter Studio — استوديو فلاتر الصور</h2><p>اضبط السطوع والتباين والتشبع والأبيض والأسود محليًا.</p><label for="ifs-file">اختر صورة PNG أو JPEG أو WebP (حتى 12 MB)</label><input id="ifs-file" type="file" accept="image/png,image/jpeg,image/webp"><div class="ur-form-grid"><label>السطوع <output id="ifs-bv">100</output>%<input id="ifs-b" type="range" min="0" max="200" value="100"></label><label>التباين <output id="ifs-cv">100</output>%<input id="ifs-c" type="range" min="0" max="200" value="100"></label><label>التشبع <output id="ifs-sv">100</output>%<input id="ifs-s" type="range" min="0" max="200" value="100"></label><label>رمادي <output id="ifs-gv">0</output>%<input id="ifs-g" type="range" min="0" max="100" value="0"></label></div><div class="ur-actions"><button class="ur-primary" id="ifs-run" type="button">تطبيق وتنزيل</button><a id="ifs-dl" class="ur-secondary ur-hidden" download="filtered-image.png">تنزيل الصورة</a></div><p id="ifs-status" role="status"></p><canvas id="ifs-canvas" style="max-width:100%;height:auto"></canvas><p class="ur-note">المعالجة داخل المتصفح؛ احتفظ بالنسخة الأصلية.</p></section><script>(function(){const $=id=>document.getElementById(id),c=$('ifs-canvas'),x=c.getContext('2d');let im=null;['b','c','s','g'].forEach(k=>$('ifs-'+k).addEventListener('input',()=>{$('ifs-'+k+'v').value=$('ifs-'+k).value;if(im)draw()}));$('ifs-file').addEventListener('change',()=>{const f=$('ifs-file').files[0];if(!f)return;if(f.size>12*1024*1024||!/^image\/(png|jpeg|webp)$/.test(f.type)){$('ifs-status').textContent='اختر صورة مدعومة بحجم أقل من 12 MB.';return}const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{im=i;c.width=Math.min(i.width,2400);c.height=Math.round(i.height*c.width/i.width);draw();URL.revokeObjectURL(u)};i.onerror=()=>{$('ifs-status').textContent='تعذر فتح الصورة.';URL.revokeObjectURL(u)};i.src=u});function draw(){if(!im)return;x.clearRect(0,0,c.width,c.height);x.filter='brightness('+$('ifs-b').value+'%) contrast('+$('ifs-c').value+'%) saturate('+$('ifs-s').value+'%) grayscale('+$('ifs-g').value+'%)';x.drawImage(im,0,0,c.width,c.height);x.filter='none'}$('ifs-run').addEventListener('click',()=>{if(!im){$('ifs-status').textContent='اختر صورة أولًا.';return}draw();c.toBlob(b=>{if(!b){$('ifs-status').textContent='تعذر تصدير الصورة.';return}const a=$('ifs-dl');a.href=URL.createObjectURL(b);a.classList.remove('ur-hidden');$('ifs-status').textContent='تم تجهيز الصورة محليًا.'},'image/png')})})();</script>
