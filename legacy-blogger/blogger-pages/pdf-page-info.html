<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><section class="ur-tool" data-tool-id="pdf-page-info" lang="ar"><p class="ur-eyebrow">FILES · PDF</p><h2>PDF Page Counter and Info — معلومات PDF</h2><p>اعرف عدد صفحات ملف PDF وأبعاد كل صفحة دون رفعه.</p><label for="pdfi-file">اختر ملف PDF (حتى 25 MB)</label><input id="pdfi-file" type="file" accept="application/pdf,.pdf"><div class="ur-actions"><button id="pdfi-run" class="ur-primary" type="button">فحص الملف</button></div><p id="pdfi-status" role="status" aria-live="polite"></p><textarea id="pdfi-output" rows="10" readonly></textarea><p class="ur-note">تعرض هذه الأداة بيانات الصفحات الأساسية، ولا تستخرج النص ولا تتحقق من توقيع PDF.</p></section><script>(function(){const $=id=>document.getElementById(id);$('pdfi-run').addEventListener('click',async()=>{const f=$('pdfi-file').files[0];if(!f){$('pdfi-status').textContent='اختر ملف PDF أولًا.';return}if(f.size>25*1024*1024){$('pdfi-status').textContent='الملف أكبر من 25 MB.';return}if(!window.PDFLib){$('pdfi-status').textContent='مكتبة PDF لم تُحمّل؛ تحقق من اتصال الإنترنت.';return}try{const d=await PDFLib.PDFDocument.load(await f.arrayBuffer()),p=d.getPages();$('pdfi-output').value='File: '+f.name+'\nSize: '+(f.size/1024).toFixed(1)+' KB\nPages: '+p.length+'\n'+p.map((x,i)=>{const z=x.getSize();return 'Page '+(i+1)+': '+Math.round(z.width)+' × '+Math.round(z.height)+' pt'}).join('\n');$('pdfi-status').textContent='تم فحص الملف محليًا.'}catch(e){$('pdfi-output').value='';$('pdfi-status').textContent='تعذر قراءة PDF؛ قد يكون مشفرًا أو تالفًا.'}})})();</script>
