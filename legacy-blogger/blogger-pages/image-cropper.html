<section class="ur-tool" data-tool-id="image-cropper" lang="ar"><p class="ur-eyebrow">IMAGE · DESIGN</p><h2>Image Cropper — قص الصور</h2><p>قص الصورة حسب إحداثيات وأبعاد تحددها، مع معاينة وتنزيل محلي.</p><label for="ic-file">اختر صورة (حتى 12 MB)</label><input id="ic-file" type="file" accept="image/png,image/jpeg,image/webp"><div class="ur-form-grid"><label>X<input id="ic-x" type="number" min="0" value="0"></label><label>Y<input id="ic-y" type="number" min="0" value="0"></label><label>Width<input id="ic-w" type="number" min="1" value="500"></label><label>Height<input id="ic-h" type="number" min="1" value="500"></label></div><div class="ur-actions"><button id="ic-run" class="ur-primary" type="button">قص وتنزيل</button><a id="ic-dl" class="ur-secondary ur-hidden" download="cropped-image.png">تنزيل الصورة</a></div><p id="ic-status" role="status"></p><canvas id="ic-canvas" style="max-width:100%;height:auto"></canvas></section><script>(function(){const $=id=>document.getElementById(id),c=$('ic-canvas'),ctx=c.getContext('2d');let im=null;$('ic-file').addEventListener('change',()=>{const f=$('ic-file').files[0];if(!f)return;if(f.size>12*1024*1024){$('ic-status').textContent='الملف أكبر من 12 MB.';return}const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{if(i.width>8000||i.height>8000){$('ic-status').textContent='أبعاد الصورة كبيرة جدًا؛ الحد الأقصى 8000 × 8000 بكسل.';URL.revokeObjectURL(u);return}im=i;$('ic-w').value=i.width;$('ic-h').value=i.height;c.width=i.width;c.height=i.height;ctx.drawImage(i,0,0);URL.revokeObjectURL(u)};i.onerror=()=>{$('ic-status').textContent='تعذر قراءة الصورة.';URL.revokeObjectURL(u)};i.src=u});$('ic-run').addEventListener('click',()=>{if(!im){$('ic-status').textContent='اختر صورة أولًا.';return}const x=Number($('ic-x').value),y=Number($('ic-y').value),w=Number($('ic-w').value),h=Number($('ic-h').value);if(![x,y,w,h].every(Number.isInteger)||x<0||y<0||w<1||h<1||x+w>im.width||y+h>im.height){$('ic-status').textContent='الإحداثيات والأبعاد خارج حدود الصورة.';return}c.width=w;c.height=h;ctx.clearRect(0,0,w,h);ctx.drawImage(im,x,y,w,h,0,0,w,h);c.toBlob(b=>{if(!b){$('ic-status').textContent='تعذر تصدير الصورة.';return}const a=$('ic-dl');a.href=URL.createObjectURL(b);a.classList.remove('ur-hidden');$('ic-status').textContent='تم قص الصورة؛ الأبعاد '+w+' × '+h+' px.'},'image/png')})})();</script>
