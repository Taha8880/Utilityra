name: Deploy to Cloudflare
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm test
      - name: Apply Utilityra D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN in Settings > Secrets > Actions"; exit 1; }
          npx wrangler d1 execute utilityra-data --remote --file=worker/schema.sql
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets > Actions"; exit 1; }
          npx wrangler deploy
      - name: Smoke test live site
        env: { SITE_URL: "${{ vars.SITE_URL }}", GOOGLE_SITE_VERIFICATION: "${{ vars.GOOGLE_SITE_VERIFICATION }}", BING_SITE_VERIFICATION: "${{ vars.BING_SITE_VERIFICATION }}" }
        run: node scripts/monitor.mjs --strict
