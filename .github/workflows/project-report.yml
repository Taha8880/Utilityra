name: Keep project report updated

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/AUTO_STATUS.md
      - docs/LIVE_STATUS.md
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: project-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run project tests
        id: tests
        continue-on-error: true
        run: npm test
      - name: Check public production site
        id: live
        continue-on-error: true
        env:
          SITE_URL: https://utilityra.tavengers16.workers.dev
        run: node scripts/monitor.mjs --strict --report docs/LIVE_STATUS.md
      - name: Collect open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$GH_REPO" --state open --limit 100 --json number,title,url,headRefName,updatedAt --jq '.[] | "- [#\(.number) — \(.title)](\(.url)) — فرع: \(.headRefName) — آخر تحديث: \(.updatedAt)"' > /tmp/open-prs.txt
          if [ ! -s /tmp/open-prs.txt ]; then echo "لا توجد طلبات دمج مفتوحة." > /tmp/open-prs.txt; fi
      - name: Generate current project report
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          GH_EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_SERVER: ${{ github.server_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p docs
          {
            echo "# Utilityra — التقرير التلقائي للحالة"
            echo
            echo "> تحديث آلي كل 6 ساعات، وعند تغييرات main. الاختبارات المحلية وفحص الموقع الحي نتيجتان منفصلتان."
            echo
            echo "- آخر تحديث: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- الحدث: $GH_EVENT"
            echo "- الفرع: $GH_REF"
            echo "- Commit: $GH_SHA ($GH_SERVER/$GH_REPOSITORY/commit/$GH_SHA)"
            echo "- بدأه: $GH_ACTOR"
            echo "- نتيجة npm test: $TEST_OUTCOME"
            echo "- نتيجة فحص الموقع الحي: $LIVE_OUTCOME"
            echo "- سجل التشغيل: $GH_SERVER/$GH_REPOSITORY/actions/runs/$GH_RUN_ID"
            if [ -n "$GH_PR_NUMBER" ]; then echo "- طلب الدمج الجاري فحصه: $GH_SERVER/$GH_REPOSITORY/pull/$GH_PR_NUMBER"; fi
            echo
            echo "## طلبات الدمج المفتوحة وقت آخر تشغيل"
            cat /tmp/open-prs.txt 2>/dev/null || echo "تعذر جلب القائمة في هذا التشغيل."
            echo
            echo "## الملفات التي تغيرت في هذا الـ commit"
            echo '---'
            git diff-tree --no-commit-id --name-status -r "$GH_SHA" || true
            echo '---'
            echo
            echo "## نقاط المتابعة — غير مثبتة كمنجزة حتى يظهر دليل"
            echo "- [ ] مراجعة docs/LIVE_STATUS.md؛ أي فشل خارجي يحتاج تشخيصًا وإعادة اختبار."
            echo "- [ ] تأكيد سبب Cloudflare 1042 بعد النشر؛ لا يُعلن الإصلاح دون نجاح فحص خارجي."
            echo "- [ ] اختبار لوحة الإدارة واتصال D1 الحقيقي وتسجيل الدخول والصلاحيات."
            echo "- [ ] اختبار مزودات الذكاء الاصطناعي بمفاتيح صالحة؛ الاختبارات الوهمية لا تثبت نجاح المزود الحقيقي."
            echo "- [ ] اختبار الأدوات الـ115 بنتائج فعلية؛ smoke test لا يثبت صحة كل نتيجة."
            echo "- [ ] استكمال اختبارات Android والمتصفحات المتعددة وLighthouse وإمكانية الوصول."
            echo "- [ ] التحقق من النسخ الاحتياطي واستعادة D1 فعليًا."
            echo
            echo "## السجلات"
            echo "- [فحص الموقع الحي](LIVE_STATUS.md)"
            echo "- [حالة المتطلبات](REQUIREMENTS_STATUS.md)"
            echo "- [سجل الأعطال والإصلاحات](INCIDENTS.md)"
            echo "- [المهندس التقني](TECHNICAL_ENGINEER.md)"
            echo
            echo "## قواعد تفسير الحالة"
            echo "- نجاح npm test لا يثبت وحده أن الموقع الحي يعمل."
            echo "- فشل فحص الموقع الحي يثبت فشل نقاط فحص محددة فقط؛ راجع التقرير الحي وسجل التشغيل."
            echo "- لا يُسجل سبب جذري أو إصلاح كحقيقة قبل وجود دليل واختبار بعد الإصلاح."
          } > docs/AUTO_STATUS.md
      - name: Publish report update
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUTO_STATUS.md docs/LIVE_STATUS.md
          if git diff --cached --quiet; then echo "Reports unchanged."; else git commit -m "docs: refresh automated project and live status"; git push; fi
      - name: Fail if project tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
      - name: Fail if live-site monitor failed
        if: steps.live.outcome != 'success'
        run: exit 1
