name: Deploy Utilityra API and private analytics

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: utilityra-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.UTILITYRA_ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.UTILITYRA_ADMIN_SESSION_SECRET }}
          OPENAI_API_KEY: ${{ secrets.UTILITYRA_OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.UTILITYRA_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to repository Actions secrets."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to repository Actions secrets."; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "::error::Add UTILITYRA_ADMIN_PASSWORD (16+ characters) to repository Actions secrets."; exit 1; }
          test "${#ADMIN_PASSWORD}" -ge 16 || { echo "::error::UTILITYRA_ADMIN_PASSWORD must be at least 16 characters."; exit 1; }
          test -n "$ADMIN_SESSION_SECRET" || { echo "::error::Add UTILITYRA_ADMIN_SESSION_SECRET (32+ characters) to repository Actions secrets."; exit 1; }
          test "${#ADMIN_SESSION_SECRET}" -ge 32 || { echo "::error::UTILITYRA_ADMIN_SESSION_SECRET must be at least 32 characters."; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Find or create D1 database and generate deployment config
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" > "$RUNNER_TEMP/d1-list.json"
          DB_ID="$(node -e 'const d=require(process.argv[1]);if(!d.success)process.exit(2);const x=(d.result||[]).find(v=>v.name==="utilityra-data");console.log(x?x.uuid:"")' "$RUNNER_TEMP/d1-list.json")"
          if [ -z "$DB_ID" ]; then
            curl -fsS -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"utilityra-data"}' > "$RUNNER_TEMP/d1-create.json"
            DB_ID="$(node -e 'const d=require(process.argv[1]);if(!d.success)process.exit(2);console.log(d.result?.uuid||"")' "$RUNNER_TEMP/d1-create.json")"
          fi
          test -n "$DB_ID" || { echo "::error::Could not resolve the D1 database ID from Cloudflare API."; exit 1; }
          sed "s/REPLACE_AFTER_CREATING_D1/$DB_ID/" wrangler.toml.example > wrangler.toml
          echo "D1 database is ready; ID is intentionally not printed."

      - name: Apply D1 schema and safe seed records
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute utilityra-data --remote --file=./schema.sql
          npx --yes wrangler@4 d1 execute utilityra-data --remote --file=./seed.sql

      - name: Configure private admin and AI provider secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.UTILITYRA_ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.UTILITYRA_ADMIN_SESSION_SECRET }}
          OPENAI_API_KEY: ${{ secrets.UTILITYRA_OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.UTILITYRA_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 secret put ADMIN_PASSWORD
          printf '%s' "$ADMIN_SESSION_SECRET" | npx --yes wrangler@4 secret put ADMIN_SESSION_SECRET
          if [ -n "$OPENAI_API_KEY" ]; then printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@4 secret put OPENAI_API_KEY; fi
          if [ -n "$GEMINI_API_KEY" ]; then printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY; fi

      - name: Deploy Worker and dashboard
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Retry transient Cloudflare asset-upload API failures; fail immediately after repeated attempts.
          for attempt in 1 2 3; do
            if npx --yes wrangler@4 deploy; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "Cloudflare deploy attempt $attempt failed; retrying after a short delay."
              sleep 10
            fi
          done
          echo "::error::Cloudflare Worker deployment failed after 3 attempts."
          exit 1

      - name: Smoke-test the public Worker after deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://utilityra.tavengers16.workers.dev"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS "$BASE/" -o "$RUNNER_TEMP/utilityra-home.html"
          grep -qi '<title>Utilityra' "$RUNNER_TEMP/utilityra-home.html"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS "$BASE/tools/word-counter" -o "$RUNNER_TEMP/utilityra-tool.html"
          grep -qi '<title>Utilityra' "$RUNNER_TEMP/utilityra-tool.html"
          for slug in html-escape slug-generator sort-lines remove-duplicate-lines json-minifier regex-tester reverse-text json-to-csv character-frequency image-resizer text-to-speech html-preview qr-generator pdf-merge pdf-split image-compressor image-cropper markdown-preview seo-auditor api-tester ai-assistant json-diff password-strength image-to-pdf pdf-rotate favicon-generator accessibility-checker page-speed-checker security-header-checker contrast-checker accessibility-checker pdf-metadata; do
            curl --retry 3 --retry-delay 2 --retry-all-errors -fsS "$BASE/tools/$slug" -o "$RUNNER_TEMP/utilityra-route.html"
            grep -q "$slug" "$RUNNER_TEMP/utilityra-route.html" || { echo "::error::Tool route missing from delivered app: $slug"; exit 1; }
          done
          echo "Smoke tests passed: homepage and every registered tool route are reachable."
          # The public /health path is currently returning 404 on the deployed workers.dev host.
          # Keep that API diagnostic separate from the user-facing static tool page deployment.

      - name: Report deployment endpoint
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments list --json > "$RUNNER_TEMP/deployments.json"
          echo "Worker deployment completed. Public app: https://utilityra.tavengers16.workers.dev/"
