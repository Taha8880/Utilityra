name: Utilityra continuous project record

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/STATUS_LATEST_AR.md'
  schedule:
    - cron: '17 */6 * * *'
  workflow_run:
    workflows:
      - Cloudflare Utilityra browser tests
      - Deploy Utilityra API and private analytics
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: utilityra-continuous-project-record
  cancel-in-progress: false

jobs:
  update-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate latest project status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/update-project-status.mjs

      - name: Commit updated status snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/STATUS_LATEST_AR.md; then
            echo "Status report unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATUS_LATEST_AR.md
          git commit -m "docs: refresh automated Utilityra project status"
          git push origin HEAD:main

      - name: Open an incident issue when a watched workflow fails
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="[Utilityra CI] فشل workflow: $FAILED_WORKFLOW"
          existing=$(gh issue list --state open --search "$title in:title" --json title --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "An open incident already exists for this workflow."
            exit 0
          fi
          body=$(printf 'فشل تشغيل آلي مرتبط بالمشروع.\n\nWorkflow: %s\nCommit: %s\nRun: %s\n\nراجع تفاصيل الخطأ، أصلح السبب، وأعد الاختبار قبل إغلاق البلاغ.' "$FAILED_WORKFLOW" "$FAILED_SHA" "$FAILED_URL")
          gh issue create --title "$title" --body "$body"
