name: Validate Utilityra rebuild
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [main, rebuild/utilityra-platform-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check worker/src/index.js
      - name: Validate theme XML, tool scripts, and manifest
        run: python scripts/validate-site.py
      - name: Test Worker API behavior
        run: node --test tests/worker.test.mjs
      - name: Check required pages exist
        run: test -s blogger-pages/word-counter.html && test -s blogger-pages/json-formatter.html && test -s blogger-pages/utilityra-theme-v1.xml
