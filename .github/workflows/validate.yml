name: Validate Utilityra starter
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check worker/src/index.js
      - name: Check page fragments are present
        run: test -s blogger-pages/word-counter.html && test -s blogger-pages/json-formatter.html && test -s blogger-pages/ai-assistant.html