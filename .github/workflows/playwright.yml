name: Playwright tool tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Test local tool interactions on desktop and mobile
        run: npx playwright test tests/e2e/tool-pages.spec.js --project=chromium-desktop --project=chromium-mobile
        env:
          CI: true
      - name: Test live Cloudflare Worker tool pages
        run: npx playwright test tests/e2e/cloudflare-tools.spec.js --project=chromium-desktop
        env:
          CI: true
      - name: Smoke test the live Blogger site
        run: npx playwright test tests/e2e/site-smoke.spec.js --project=chromium-desktop --project=chromium-mobile
        env:
          CI: true
          UTILITYRA_BASE_URL: https://utilityra.blogspot.com
