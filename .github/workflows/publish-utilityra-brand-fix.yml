name: Sync Utilityra pages to Blogger

on:
  push:
    branches: [main]
    paths:
      - "blogger-pages/**"
      - "scripts/blogger-sync.mjs"

concurrency:
  group: utilityra-page-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish Utilityra pages
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          PUBLISH_MODE: publish
        run: node scripts/blogger-sync.mjs
