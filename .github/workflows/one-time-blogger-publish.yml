name: One-time publish static Flarivo pages to Blogger

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flarivo-one-time-blogger-publish
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-blogger-pages-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Exclude AI page until its backend is deployed
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'blogger-pages/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(p, 'utf8'));
          const before = manifest.pages.length;
          manifest.pages = manifest.pages.filter(page => page.file !== 'ai-assistant.html');
          fs.writeFileSync(p, JSON.stringify(manifest, null, 2) + '\n');
          console.log(`Publishing ${manifest.pages.length} static/support pages; excluded ${before - manifest.pages.length} AI page because its backend is not deployed.`);
          NODE

      - name: Publish static/support pages to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          PUBLISH_MODE: publish
        run: node scripts/blogger-sync.mjs
