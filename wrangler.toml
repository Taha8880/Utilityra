# Utilityra — Cloudflare Worker + static assets (built into ./dist by `npm run build`).
name = "utilityra"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Autonomous technical engineer: health check every 30 minutes (incidents + diagnosis appear in /admin/ awaiting your approval).
[triggers]
crons = ["*/30 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Only the API and health endpoints run the Worker first; pages are served straight from assets.
run_worker_first = ["/api/*", "/health", "/sitemap.xml", "/robots.txt"]

[vars]
# Extra origins allowed to call /api/* (comma separated). The site's own origin is always allowed.
ALLOWED_ORIGINS = ""
# Cloudflare AI Gateway (dashboard: AI > AI Gateway). Workers AI calls go through it; if the id is missing the Worker falls back to a direct call.
AI_GATEWAY_ID = "utilityra"
# Optional, to route OpenAI/Gemini through the gateway too: AI_GATEWAY_URL = "https://gateway.ai.cloudflare.com/v1/<ACCOUNT_ID>/utilityra"

# Workers AI powers the AI tools by default (no API key needed). Check account limits/pricing.
[ai]
binding = "AI"

# D1 — analytics, admin dashboard and technical-engineer incident log
[[d1_databases]]
binding = "DB"
database_name = "utilityra-data"
database_id = "3fc2bb1b-260c-46b8-88b5-3fdc862be186"

# OPTIONAL secrets for other AI providers: OPENAI_API_KEY, GEMINI_API_KEY (never commit them).
