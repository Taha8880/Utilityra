<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><section class="ur-tool" data-tool-id="pdf-split" lang="ar"><p class="ur-eyebrow">FILES · PDF</p><h2>PDF Page Extractor — استخراج صفحات PDF</h2><p>استخرج نطاقات صفحات محددة إلى ملفات PDF منفصلة داخل المتصفح.</p><label for="pdfs-file">اختر ملف PDF (حتى 25 MB)</label><input id="pdfs-file" type="file" accept="application/pdf,.pdf"><label for="pdfs-ranges">نطاقات الصفحات (مثال: 1-3,5,8-10)</label><input id="pdfs-ranges" type="text" placeholder="1-3,5"><div class="ur-actions"><button id="pdfs-run" class="ur-primary" type="button">استخراج الصفحات</button></div><p id="pdfs-status" role="status" aria-live="polite"></p><div id="pdfs-links" class="ur-actions"></div><p class="ur-note">أرقام الصفحات تبدأ من 1. لا يتم رفع ملفك إلى خادم Utilityra.</p></section><script>(function(){const $=id=>document.getElementById(id);$('pdfs-run').addEventListener('click',async()=>{const f=$('pdfs-file').files[0],range=$('pdfs-ranges').value.trim();$('pdfs-links').replaceChildren();if(!f||!range){$('pdfs-status').textContent='اختر PDF واكتب نطاق الصفحات.';return}if(f.size>25*1024*1024){$('pdfs-status').textContent='الملف أكبر من 25 MB.';return}if(!window.PDFLib){$('pdfs-status').textContent='مكتبة PDF لم تُحمّل؛ تحقق من اتصال الإنترنت.';return}try{const src=await PDFLib.PDFDocument.load(await f.arrayBuffer()),max=src.getPageCount(),parts=range.split(',').map(x=>x.trim());if(parts.length>10)throw Error('استخدم حتى 10 نطاقات في المرة الواحدة.');let made=0;for(let i=0;i<parts.length;i++){const m=parts[i].match(/^(\d+)(?:-(\d+))?$/);if(!m)throw Error('نطاق غير صحيح: '+parts[i]);const start=Number(m[1]),end=Number(m[2]||m[1]);if(start<1||end<start||end>max)throw Error('النطاق '+parts[i]+' خارج عدد الصفحات ('+max+').');const out=await PDFLib.PDFDocument.create(),idx=Array.from({length:end-start+1},(_,j)=>start-1+j),copied=await out.copyPages(src,idx);copied.forEach(p=>out.addPage(p));const blob=new Blob([await out.save()],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pages-'+parts[i].replace('-','-')+'.pdf';a.className='ur-secondary';a.textContent='تنزيل الصفحات '+parts[i];$('pdfs-links').appendChild(a);made++}$('pdfs-status').textContent='تم إنشاء '+made+' ملفات منفصلة.'}catch(e){$('pdfs-status').textContent=e.message||'تعذر استخراج الصفحات.'}})})();</script>
