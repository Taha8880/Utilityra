<section class="ur-tool" data-tool-id="image-watermark" lang="ar"><p class="ur-eyebrow">IMAGE · DESIGN</p><h2>Image Watermark Tool — إضافة علامة مائية</h2><p>أضف نصًا وعلامة مائية إلى الصورة محليًا مع التحكم في الشفافية والحجم.</p><label for="iw-file">اختر صورة (حتى 12 MB)</label><input id="iw-file" type="file" accept="image/png,image/jpeg,image/webp"><label for="iw-text">نص العلامة المائية</label><input id="iw-text" type="text" maxlength="80" value="Utilityra"><div class="ur-form-grid"><label>الشفافية <output id="iw-ov">35</output>%<input id="iw-opacity" type="range" min="5" max="100" value="35"></label><label>حجم الخط<input id="iw-size" type="number" min="10" max="240" value="48"></label><label>الموضع<select id="iw-pos"><option value="br">أسفل اليمين</option><option value="bl">أسفل اليسار</option><option value="center">المنتصف</option><option value="tr">أعلى اليمين</option><option value="tl">أعلى اليسار</option></select></label></div><div class="ur-actions"><button id="iw-run" class="ur-primary" type="button">تطبيق وتنزيل</button><a id="iw-dl" class="ur-secondary ur-hidden" download="watermarked-image.png">تنزيل</a></div><p id="iw-status" role="status"></p><canvas id="iw-canvas" style="max-width:100%;height:auto"></canvas></section><script>(function(){const $=id=>document.getElementById(id),c=$('iw-canvas'),ctx=c.getContext('2d');let im=null;$('iw-opacity').addEventListener('input',()=>$('iw-ov').value=$('iw-opacity').value);$('iw-file').addEventListener('change',()=>{const f=$('iw-file').files[0];if(!f)return;if(f.size>12*1024*1024){$('iw-status').textContent='الملف أكبر من 12 MB.';return}const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{im=i;c.width=Math.min(i.width,3000);c.height=Math.round(i.height*c.width/i.width);ctx.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u)};i.onerror=()=>{$('iw-status').textContent='تعذر قراءة الصورة.';URL.revokeObjectURL(u)};i.src=u});$('iw-run').addEventListener('click',()=>{if(!im){$('iw-status').textContent='اختر صورة أولًا.';return}ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);const text=$('iw-text').value.trim();if(!text){$('iw-status').textContent='اكتب نص العلامة المائية.';return}const size=Number($('iw-size').value);if(!Number.isInteger(size)||size<10||size>240){$('iw-status').textContent='حجم الخط من 10 إلى 240.';return}const margin=Math.max(12,size*.5),pos=$('iw-pos').value;ctx.save();ctx.globalAlpha=Number($('iw-opacity').value)/100;ctx.fillStyle='#ffffff';ctx.strokeStyle='#000000';ctx.lineWidth=Math.max(1,size/18);ctx.font='bold '+size+'px system-ui,Arial';ctx.textBaseline='middle';let x=margin,y=margin;if(pos.endsWith('r'))x=c.width-margin-ctx.measureText(text).width;if(pos.startsWith('b'))y=c.height-margin; if(pos==='center'){x=(c.width-ctx.measureText(text).width)/2;y=c.height/2}ctx.strokeText(text,x,y);ctx.fillText(text,x,y);ctx.restore();c.toBlob(b=>{if(!b){$('iw-status').textContent='تعذر التصدير.';return}const a=$('iw-dl');a.href=URL.createObjectURL(b);a.classList.remove('ur-hidden');$('iw-status').textContent='تم إنشاء الصورة ذات العلامة المائية.'},'image/png')})})();</script>
