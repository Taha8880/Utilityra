<!-- Paste into a Blogger Page using HTML view. Set the Blogger page title to: JSON Formatter and Validator | Utilityra -->
<section class="utilityra-tool" lang="en" aria-labelledby="ujf-title">
  <h2 id="ujf-title">JSON Formatter and Validator</h2>
  <p>Format JSON into readable text or validate it. Processing happens locally in your browser.</p>
  <label for="ujf-input">JSON input</label>
  <textarea id="ujf-input" rows="12" spellcheck="false" placeholder='{"name":"Utilityra","active":true}' style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #bbb;border-radius:10px"></textarea>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" id="ujf-format">Format JSON</button><button type="button" id="ujf-minify">Minify JSON</button><button type="button" id="ujf-copy">Copy result</button><button type="button" id="ujf-clear">Clear</button></div>
  <p id="ujf-status" role="status" aria-live="polite"></p>
  <label for="ujf-output">Result</label>
  <textarea id="ujf-output" rows="12" readonly spellcheck="false" style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #bbb;border-radius:10px"></textarea>
</section>
<script>
(function(){
 const $=id=>document.getElementById(id);const input=$('ujf-input'),output=$('ujf-output'),status=$('ujf-status');if(!input||!output||!status)return;
 function transform(minify){try{const parsed=JSON.parse(input.value);output.value=JSON.stringify(parsed,null,minify?0:2);status.textContent='Valid JSON.';status.style.color='green'}catch(e){output.value='';status.textContent='Invalid JSON: '+e.message;status.style.color='crimson'}}
 $('ujf-format').addEventListener('click',()=>transform(false));$('ujf-minify').addEventListener('click',()=>transform(true));
 $('ujf-clear').addEventListener('click',()=>{input.value='';output.value='';status.textContent='';input.focus()});
 $('ujf-copy').addEventListener('click',async()=>{if(!output.value){status.textContent='There is no result to copy.';return}try{await navigator.clipboard.writeText(output.value);status.textContent='Copied.'}catch{output.focus();output.select();status.textContent='Select the result and copy it manually.'}});
})();
</script>
