<section class="ur-tool" data-tool-id="file-metadata-inspector" lang="ar"><p class="ur-eyebrow">FILES · PRIVACY</p><h2>File Metadata Inspector — فحص بيانات الملف</h2><p>اعرض الاسم والنوع والحجم وتاريخ التعديل، وأبعاد الصور إن وجدت. لا يتم رفع الملف.</p><label for="fmi-file">اختر ملفًا</label><input id="fmi-file" type="file"><div class="ur-actions"><button id="fmi-run" class="ur-primary" type="button">فحص الملف</button></div><p id="fmi-status" role="status"></p><textarea id="fmi-output" rows="9" readonly></textarea></section><script>(function(){const $=id=>document.getElementById(id);$('fmi-run').addEventListener('click',async()=>{const f=$('fmi-file').files[0];if(!f){$('fmi-status').textContent='اختر ملفًا أولًا.';return}const out=['Name: '+f.name,'MIME type: '+(f.type||'unknown'),'Size: '+f.size+' bytes ('+(f.size/1024).toFixed(2)+' KB)','Last modified: '+new Date(f.lastModified).toISOString()];if(f.type.startsWith('image/')){const u=URL.createObjectURL(f);try{const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=u});out.push('Dimensions: '+im.naturalWidth+' × '+im.naturalHeight+' px')}catch(e){out.push('Image dimensions: unavailable')}finally{URL.revokeObjectURL(u)}}if(crypto.subtle){const digest=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());out.push('SHA-256: '+Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join(''))}$('fmi-output').value=out.join('\n');$('fmi-status').textContent='تم الفحص محليًا.'})})();</script>
