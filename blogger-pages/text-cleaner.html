<!-- Utilityra tool page: text cleaner. Review as a Blogger draft before publishing. -->
<section class="ur-tool" lang="en" aria-labelledby="utc-title">
  <p class="ur-eyebrow">TEXT TOOLS</p><h2 id="utc-title">Text Cleaner and Formatter</h2>
  <p>Remove extra spaces, blank lines, duplicate lines, or normalize line breaks without sending your text to a server.</p>
  <label for="utc-input">Text to clean</label><textarea id="utc-input" rows="12" placeholder="Paste your text here…"></textarea>
  <div class="ur-actions"><label><input type="checkbox" id="utc-trim" checked="checked"/> Trim each line</label><label><input type="checkbox" id="utc-space" checked="checked"/> Collapse repeated spaces</label><label><input type="checkbox" id="utc-blank"/> Remove blank lines</label><label><input type="checkbox" id="utc-unique"/> Remove duplicate lines</label></div>
  <div class="ur-actions"><button type="button" id="utc-run" class="ur-primary">Clean text</button><button type="button" id="utc-clear" class="ur-secondary">Clear</button><button type="button" id="utc-copy" class="ur-secondary">Copy result</button></div>
  <p id="utc-status" role="status" aria-live="polite"></p><label for="utc-output">Cleaned text</label><textarea id="utc-output" rows="12" readonly="readonly"></textarea>
</section>
<script>
(function(){const $=id=>document.getElementById(id),input=$('utc-input'),output=$('utc-output'),status=$('utc-status');if(!input||!output)return;
$('utc-run').addEventListener('click',()=>{let lines=input.value.replace(/\r\n?/g,'\n').split('\n');if($('utc-trim').checked)lines=lines.map(x=>x.trim());if($('utc-space').checked)lines=lines.map(x=>x.replace(/[ \t]{2,}/g,' '));if($('utc-blank').checked)lines=lines.filter(x=>x.trim());if($('utc-unique').checked){const seen=new Set();lines=lines.filter(x=>seen.has(x)?false:(seen.add(x),true))}output.value=lines.join('\n');status.textContent='Text cleaned. '+lines.length+' lines.'});
$('utc-clear').addEventListener('click',()=>{input.value='';output.value='';status.textContent=''});
$('utc-copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(output.value);status.textContent='Copied.'}catch{output.focus();output.select();status.textContent='Select the result and copy it manually.'}});
})();
</script>
