<section class="ur-tool" data-tool-id="image-rotate-flip" lang="ar"><p class="ur-eyebrow">IMAGE · DESIGN</p><h2>Image Rotate and Flip — تدوير وقلب الصور</h2><p>دوّر الصورة أو اقلبها أفقيًا ورأسيًا.</p><label for="irf-file">اختر صورة (حتى 12 MB)</label><input id="irf-file" type="file" accept="image/png,image/jpeg,image/webp"><label for="irf-angle">زاوية الدوران</label><select id="irf-angle"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select><div class="ur-actions"><label><input id="irf-h" type="checkbox"> قلب أفقي</label><label><input id="irf-v" type="checkbox"> قلب رأسي</label><button id="irf-run" class="ur-primary" type="button">تطبيق وتنزيل</button><a id="irf-dl" class="ur-secondary ur-hidden" download="rotated-image.png">تنزيل</a></div><p id="irf-status" role="status"></p><canvas id="irf-canvas" style="max-width:100%;height:auto"></canvas></section><script>(function(){const $=id=>document.getElementById(id),c=$('irf-canvas'),x=c.getContext('2d');let im=null;$('irf-file').addEventListener('change',()=>{const f=$('irf-file').files[0];if(!f)return;if(f.size>12*1024*1024){$('irf-status').textContent='الملف أكبر من 12 MB.';return}const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{im=i;draw();URL.revokeObjectURL(u)};i.onerror=()=>{$('irf-status').textContent='تعذر قراءة الصورة.';URL.revokeObjectURL(u)};i.src=u});function draw(){if(!im)return;const a=Number($('irf-angle').value)*Math.PI/180,swap=Number($('irf-angle').value)%180!==0;c.width=swap?im.height:im.width;c.height=swap?im.width:im.height;x.clearRect(0,0,c.width,c.height);x.save();x.translate(c.width/2,c.height/2);x.rotate(a);x.scale($('irf-h').checked?-1:1,$('irf-v').checked?-1:1);x.drawImage(im,-im.width/2,-im.height/2);x.restore()}$('irf-angle').addEventListener('change',draw);$('irf-h').addEventListener('change',draw);$('irf-v').addEventListener('change',draw);$('irf-run').addEventListener('click',()=>{if(!im){$('irf-status').textContent='اختر صورة أولًا.';return}draw();c.toBlob(b=>{if(!b){$('irf-status').textContent='تعذر التصدير.';return}const a=$('irf-dl');a.href=URL.createObjectURL(b);a.classList.remove('ur-hidden');$('irf-status').textContent='تم تجهيز الصورة.'},'image/png')})})();</script>
