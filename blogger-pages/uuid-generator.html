<!-- Utilityra tool page: UUID generator. Review as a Blogger draft before publishing. -->
<section class="ur-tool" lang="en" aria-labelledby="uug-title">
  <p class="ur-eyebrow">DEVELOPER TOOLS</p><h2 id="uug-title">UUID v4 Generator</h2>
  <p>Generate random UUID v4 identifiers using the browser's cryptographically secure random generator.</p>
  <label for="uug-count">Number of UUIDs (1–100)</label><input id="uug-count" type="number" min="1" max="100" value="5"/>
  <div class="ur-actions"><button type="button" id="uug-run" class="ur-primary">Generate UUIDs</button><button type="button" id="uug-copy" class="ur-secondary">Copy result</button><button type="button" id="uug-clear" class="ur-secondary">Clear</button></div>
  <p id="uug-status" role="status" aria-live="polite"></p><label for="uug-output">Generated UUIDs</label><textarea id="uug-output" rows="10" readonly="readonly"></textarea>
</section>
<script>
(function(){const $=id=>document.getElementById(id),count=$('uug-count'),output=$('uug-output'),status=$('uug-status');if(!count||!output)return;
$('uug-run').addEventListener('click',()=>{const n=Number(count.value);if(!Number.isInteger(n)||n<1||n>100){status.textContent='Enter a whole number from 1 to 100.';return}if(!crypto.randomUUID){status.textContent='UUID generation is not supported by this browser. Update your browser and use HTTPS.';return}output.value=Array.from({length:n},()=>crypto.randomUUID()).join('\n');status.textContent=n+' UUIDs generated.'});
$('uug-copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(output.value);status.textContent='Copied.'}catch{output.focus();output.select();status.textContent='Select the result and copy it manually.'}});
$('uug-clear').addEventListener('click',()=>{output.value='';status.textContent=''});
})();
</script>
